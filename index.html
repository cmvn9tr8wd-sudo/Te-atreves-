function playVipSound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') { audioCtx.resume(); }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  } catch(e) {}
}

function playSuccessSound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') { audioCtx.resume(); }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.12);
    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.24);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  } catch(e) {}
}

function playFailSound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') { audioCtx.resume(); }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.35);
  } catch(e) {}
}

window.switchTab = function(tabId, btnElement) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  $(tabId).classList.add('active');
  btnElement.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

function status(id, msg, kind="") { const el=$(id); el.textContent=msg; el.className="status"+(kind?" "+kind:""); el.classList.remove("hidden"); }
function cleanCode(s){return (s||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8)}
function isUuid(value){return typeof value === "string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value)}

function getAvatarUrl(seed) { 
  if (seed && seed.startsWith("http")) return seed;
  return `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(seed || 'Cali')}`; 
}

function showToast(message) {
  const container = $("toastContainer");
  if(!container) return;
  if(navigator.vibrate) { navigator.vibrate(200); }
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.innerHTML = `🔔 <strong>Aviso:</strong> ${safe(message)}`;
  container.appendChild(toast);
  setTimeout(() => { toast.remove(); }, 3500);
}

window.buySticker = async function(stickerId) {
  if(profile.coins < 30) { playFailSound(); alert("No tienes suficientes monedas (necesitas 🪙 30)."); return; }
  const unlocked = getUnlockedStickers();
  if(unlocked.includes(stickerId)) return;

  try {
    if(currentRoom && user) {
      const {data: curMem, error: errGet} = await supabase.from("game_members").select("coins").eq("room_id", currentRoom.id).eq("user_id", user.id).single();
      if(!errGet && curMem) {
        const realCoins = curMem.coins !== undefined ? curMem.coins : profile.coins;
        if(realCoins < 30) { playFailSound(); alert("No tienes suficientes monedas."); return; }
        await supabase.from("game_members").update({coins: realCoins - 30}).eq("room_id", currentRoom.id).eq("user_id", user.id);
        profile.coins = realCoins - 30;
        $("userCoins").textContent = "🪙 " + profile.coins;
      }
    } else {
      profile.coins -= 30;
      $("userCoins").textContent = "🪙 " + profile.coins;
    }

    unlocked.push(stickerId);
    saveUnlockedStickers(unlocked);
    playSuccessSound();
    showToast("¡Sticker desbloqueado con éxito!");
    renderStickersUI();
  } catch(e) {
    playFailSound();
    alert("Error al comprar sticker: " + e.message);
  }
};

window.downloadSticker = async function(url, name) {
  try {
    playSuccessSound();
    showToast("Preparando sticker para WhatsApp...");
    const response = await fetch(url);
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = `${name}_sticker.webp`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(blobUrl);
    showToast("¡Sticker descargado!");
  } catch(e) {
    window.open(url, '_blank');
  }
};

window.selectStickerForPost = function(url) {

function saveProfile(){
 const n=$("nickname").value.trim();
 if(n.length < 2){ playFailSound(); status("homeMsg","Elige un apodo de al menos 2 caracteres.","error"); alert("Por favor escribe un apodo de al menos 2 caracteres."); return false; }

async function rpc(name,args){const {data,error}=await supabase.rpc(name,args);if(error)throw error;return data}

async function createRoom(){
 if(!saveProfile()) return;
 try{
  const roomName = $("newRoomName").value.trim() || "Mi grupo";
  const data = await rpc("create_game_room",{p_room_name: roomName, p_nickname: profile.name, p_avatar: profile.avatar});
  if(!data || !data.room_id) throw new Error("No se pudo obtener el ID de la sala");
  playSuccessSound();
  await openRoom(data.room_id, data.room_code, data.room_name);
 }catch(e){ playFailSound(); status("homeMsg","Error al crear sala: "+e.message,"error"); alert("Error al crear sala: "+e.message); }
}

async function joinRoom(){
 if(!saveProfile()) return;
 const code=cleanCode($("joinCode").value);
 if(code.length<5){ playFailSound(); status("homeMsg","Escribe un código válido.","error"); alert("Escribe un código de sala válido."); return; }
 try{
  const data=await rpc("join_game_room",{p_room_code:code,p_nickname:profile.name,p_avatar:profile.avatar});
  playSuccessSound();
  await openRoom(data.room_id,data.room_code,data.room_name);
 }catch(e){ playFailSound(); status("homeMsg","Error al entrar: "+e.message,"error"); alert("Error al entrar a la sala: "+e.message); }
}

async function openRoom(id,code,name){
 currentRoom={id,code,name};
 $("btnTabGame").classList.remove("hidden");
 window.switchTab('tab-game', $("btnTabGame"));

 $("roomTitle").textContent=name;
 $("roomCode").textContent=code;
 $("shareLink").textContent="Invitación: "+location.origin+location.pathname+"?sala="+code;
 history.replaceState({}, "", location.pathname+"?sala="+code);
 await refreshRoom(true);
 if(roomChannel) await supabase.removeChannel(roomChannel);
 roomChannel=supabase.channel("room-"+id)
   .on("postgres_changes",{event:"*",schema:"public",table:"game_questions",filter:"room_id=eq."+id},payload => {
     if(payload.new && payload.new.nickname && payload.new.nickname.includes("VIP")) { playVipSound(); }
     refreshRoom(false);
   })
   .on("postgres_changes",{event:"*",schema:"public",table:"game_comments"},() => refreshRoom(false))
   .on("postgres_changes",{event:"*",schema:"public",table:"game_members",filter:"room_id=eq."+id},() => refreshRoom(false))
   .subscribe();
 if(refreshTimer) clearInterval(refreshTimer);
 refreshTimer=setInterval(() => refreshRoom(false), 12000);
}

async function refreshRoom(isFirstLoad = false){
 if(!currentRoom)return;
 try{
  const [membersRes, questionsRes, commentsRes]=await Promise.all([
   supabase.from("game_members").select("nickname,avatar,coins,user_id").eq("room_id",currentRoom.id).order("created_at"),
   supabase.from("game_questions").select("*").eq("room_id",currentRoom.id).order("created_at",{ascending:false}).limit(100),
   supabase.from("game_comments").select("*").order("created_at",{ascending:true})
  ]);
  
  const members = membersRes.data || [];
  const questions = questionsRes.data || [];
  const comments = commentsRes.data || [];
  
  const myCards = getLocalCards().filter(c => !c.is_used);
  const isVip = getVipStatus();
  
  if(!isFirstLoad) {
    if(questions.length > lastQuestionCount) {
      const latest = questions[0];
      if(latest && latest.author_id !== user.id) { showToast(`${latest.nickname} publicó algo nuevo.`); }
    }
  }
  lastQuestionCount = questions.length;

  const me = members.find(m => m.user_id === user.id);
  if(me) { 
    profile.coins = me.coins !== undefined ? me.coins : 50; 
    $("userCoins").textContent = "🪙 " + profile.coins; 
  }

  $("players").innerHTML = members.length ? members.map(m => `
    <span class="player" onclick="window.selectTarget('${m.user_id}', '${safe(m.nickname)}')"><img src="${safe(m.avatar)}" alt="avatar"> ${safe(m.nickname)} ${m.user_id===user.id?'(Tú)':''}<span class="tiny" style="color:var(--cyan);margin-left:4px">🎯 Retar</span></span>
  `).join("") : '<span class="muted">Sin jugadores.</span>';
  
  $("questions").innerHTML = questions.length ? questions.map(q => {
    const qComments = comments.filter(c => c.question_id === q.id);
    const targetTag = q.target_nickname ? `<span class="pill" style="background:#4a1e4a;margin-bottom:6px">🎯 Dirigido a: ${safe(q.target_nickname)}</span><br>` : '';

    const isClaimed = q.reward_claimed === true || q.reward_claimed === "true" || processedLocally.has(q.id);

    let authorDisplay = safe(q.nickname);
    if(authorDisplay.includes("VIP")) {
      authorDisplay = `<span class="vip-animated-name">${authorDisplay} <span class="vip-emoji">🔥</span></span>`;
    }

    let cardButtonsHtml = '';
    if(!isClaimed && q.kind === 'reto' && myCards.length > 0) {
      cardButtonsHtml = `<div style="margin-top:8px;padding:8px;background:#100c24;border-radius:10px">
        <span class="tiny" style="color:var(--gold);font-weight:bold">Aplicar carta de tu inventario:</span>
        <div class="row" style="margin-top:4px">
          ${myCards.map(c => `<button class="secondary" style="padding:4px 8px;font-size:0.75rem" onclick="window.applyCardToQuestion('${q.id}', '${c.id}', '${safe(c.card_name)}')">Usar ${safe(c.card_name)}</button>`).join('')}
        </div>
      </div>`;
    }

    let rewardActionHtml = '';
    if (q.kind === 'reto') {
      if (!isClaimed) {
        rewardActionHtml = `
          <div class="row" style="gap:4px">
            <button id="btn-rew-${q.id}" class="secondary" style="padding:4px 8px;font-size:0.75rem;background:#10b981;color:#fff" onclick="window.confirmReward('${q.id}')">✅ Cumplió (🪙10 o Doble)</button>
            <button id="btn-fail-${q.id}" class="secondary" style="padding:4px 8px;font-size:0.75rem;background:var(--bad);color:#fff" onclick="window.confirmFail('${q.id}')">❌ No (-🪙10)</button>
          </div>`;
      } else {
        rewardActionHtml = `<span class="tiny" style="color:var(--good);font-weight:bold">✔️ Reto Procesado</span>`;

     </article>
    `;
  }).join("") : '<p class="muted">No hay publicaciones todavía.</p>';
  
  $("myCardsList").innerHTML = myCards.length ? myCards.map(c => `
   <div class="card-item">
    <strong>🛡️ ${safe(c.card_name)}</strong><br>
    <span class="muted" style="font-size:0.8rem">Efecto: ${safe(c.card_desc || 'Especial')}</span>
   </div>
  `).join("") : '<span class="muted" style="font-size:0.85rem">No tienes cartas activas.</span>';

  if (isVip) {
    $("myVipStatus").innerHTML = `
     <div class="card-item" style="border-color:var(--gold);background:linear-gradient(135deg,#3b2712,#1a1309)">
      <strong class="vip-animated-name">${safe(getVipTitle())} <span class="vip-emoji">✨</span></strong><br>
      <span class="muted" style="font-size:0.8rem">Efecto neón, emojis animados y sonido VIP activos.</span>
     </div>
    `;
    $("buyVipBtn").classList.add("hidden");
    $("vipCustomBox").classList.remove("hidden");
  } else {
    $("myVipStatus").innerHTML = '<span class="muted" style="font-size:0.85rem">No has adquirido el rango VIP.</span>';
    $("buyVipBtn").classList.remove("hidden");
    $("vipCustomBox").classList.add("hidden");
  }

 }catch(e){console.error(e)}
}

window.applyCardToQuestion = async function(questionId, cardId, cardName){
  if(!currentRoom || !user) { alert("Entra primero a una sala."); return; }
  if(!confirm(`¿Usar la carta "${cardName}" en esta publicación?`)) return;

  try {
    const {data: qData} = await supabase.from("game_questions").select("*").eq("id", questionId).single();
    if(!qData) throw new Error("Publicación no encontrada");
    if(qData.kind !== 'reto') { playFailSound(); alert("Las cartas de salvación solo aplican para Retos."); return; }

    if (cardName.includes("Comodín")) {
      playSuccessSound();
      await supabase.from("game_questions").update({applied_card: "🃏 Carta de Comodín aplicada"}).eq("id", questionId);
      showToast("Carta Comodín aplicada.");
    } else if (cardName.includes("Bloqueo")) {
      playSuccessSound();
      const targetId = qData.target_user_id || user.id;
      const {data: targetMember} = await supabase.from("game_members").select("coins").eq("room_id", currentRoom.id).eq("user_id", targetId).single();
      const currentCoins = targetMember ? (targetMember.coins || 0) : 50;
      
      await supabase.from("game_members").update({coins: currentCoins + 10}).eq("room_id", currentRoom.id).eq("user_id", targetId);
      await supabase.from("game_questions").update({applied_card: "🛡️ Carta de Bloqueo (Salvado +10🪙)", reward_claimed: true}).eq("id", questionId);
      showToast("¡Bloqueo exitoso! Te has salvado y ganado 10 monedas.");
    } else if (cardName.includes("Recompensa Doble")) {
      playSuccessSound();
      await supabase.from("game_questions").update({applied_card: "✨ Recompensa Doble Activada (20🪙)"}).eq("id", questionId);
      showToast("Carta de Recompensa Doble aplicada.");
    }

    let cards = getLocalCards();
    cards = cards.map(c => c.id === cardId ? {...c, is_used: true} : c);
    saveLocalCards(cards);

    await refreshRoom(false);
  } catch(e) {
    playFailSound();
    alert("Error al aplicar la carta: " + (e.message || e));
    await refreshRoom(false);
  }
};

window.confirmReward = async function(questionId){
  playSuccessSound();
  processedLocally.add(questionId);
  saveProcessedLocal();

  const actionArea = $(`action-area-${questionId}`);
  if(actionArea) actionArea.innerHTML = `<span class="tiny" style="color:var(--good);font-weight:bold">✔️ Procesado</span>`;
  const cardWrap = $(`card-wrap-${questionId}`);
  if(cardWrap) cardWrap.innerHTML = '';

  try {
    const {data: qData} = await supabase.from("game_questions").select("*").eq("id", questionId).single();
    if(!qData) throw new Error("Publicación no encontrada");
    
    let targetId = qData.target_user_id || qData.author_id;
    const {data: targetMember, error: errFetch} = await supabase.from("game_members").select("coins").eq("room_id", currentRoom.id).eq("user_id", targetId).single();
    if(errFetch) throw errFetch;

    const currentCoins = targetMember ? (targetMember.coins !== undefined ? targetMember.coins : 50) : 50;
    
    let premio = 10;
    if(qData.applied_card && qData.applied_card.includes("Doble")) {
      premio = 20;
    }

    const newCoins = currentCoins + premio;

    await supabase.from("game_members").update({coins: newCoins}).eq("room_id", currentRoom.id).eq("user_id", targetId);
    await supabase.from("game_questions").update({reward_claimed: true, applied_card: (qData.applied_card || "") + " ✔️ Cumplido"}).eq("id", questionId);

    showToast(`¡Cumplido! Se otorgaron ${premio} monedas.`);
    await refreshRoom(false);
  } catch(e) {
    showToast("Recompensa aplicada localmente.");
    await refreshRoom(false);
  }
};

window.confirmFail = async function(questionId){

  const cardWrap = $(`card-wrap-${questionId}`);
  if(cardWrap) cardWrap.innerHTML = '';

  try {
    const {data: qData} = await supabase.from("game_questions").select("*").eq("id", questionId).single();
    if(!qData) throw new Error("Publicación no encontrada");

    let targetId = qData.target_user_id || qData.author_id;
    const {data: targetMember, error: errFetch} = await supabase.from("game_members").select("coins").eq("room_id", currentRoom.id).eq("user_id", targetId).single();
    if(errFetch) throw errFetch;

    const currentCoins = targetMember ? (targetMember.coins !== undefined ? targetMember.coins : 50) : 50;

window.buyCard = async function(){
 if(!currentRoom)return;
 if(profile.coins < 40){playFailSound(); alert("No tienes suficientes monedas (necesitas 🪙 40).");return;}
 try{
  const socialCards = [
    {name: "🃏 Carta de Comodín", desc: "Elige a alguien. Si falla, ambos pierden 5 monedas."},
    {name: "🛡️ Carta de Bloqueo", desc: "Te salvas de hacer el reto y ganas 10 monedas."},
    {name: "✨ Recompensa Doble", desc: "Duplica la recompensa de un reto (20🪙)."}
  ];
  const chosen = socialCards[Math.floor(Math.random()*socialCards.length)];
  
  const {data: curMem, error: errGet} = await supabase.from("game_members").select("coins").eq("room_id", currentRoom.id).eq("user_id", user.id).single();
  if(errGet) throw errGet;
  
  const realCoins = curMem ? (curMem.coins || 50) : profile.coins;
  if(realCoins < 40) { playFailSound(); alert("No tienes suficientes monedas."); return; }

  const newCoins = realCoins - 40;
  await supabase.from("game_members").update({coins: newCoins}).eq("room_id", currentRoom.id).eq("user_id", user.id);

  const cards = getLocalCards();
  cards.push({
    id: 'card-' + Date.now() + '-' + Math.random().toString(36,2),
    card_name: chosen.name,
    card_desc: chosen.desc,
    is_used: false
  });
  saveLocalCards(cards);

  playSuccessSound();
  alert("¡Compraste la carta: " + chosen.name + "!");
  refreshRoom(false);
 }catch(e){playFailSound(); alert("Error al comprar carta: "+e.message)}
};

async function postQuestion(){
 if(!currentRoom||!saveProfile())return;
 if(!isUuid(currentRoom.id)){ status("roomMsg", "Identificador de sala no válido.", "error"); return; }
 if(!user || !isUuid(user.id)){ status("roomMsg", "Identificador de usuario no válido.", "error"); return; }
 if(targetUser && !isUuid(targetUser.id)){ targetUser = null; $("targetIndicator").classList.add("hidden"); }
 const body=$("qText").value.trim();
 const fileInput=$("qImageFile");
 
 if(body.length<2 && (!fileInput.files || fileInput.files.length === 0) && !selectedStickerUrl){
   playFailSound();
   status("roomMsg","Escribe un texto, sube una foto o selecciona un sticker.","error");
   return;
 }
 try{
  let imageUrl = selectedStickerUrl;
  if(fileInput.files && fileInput.files[0]){
    const file = fileInput.files[0];
    imageUrl = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
  }
  
  let authorName = profile.name;
  if(getVipStatus()) { authorName = getVipTitle() + " " + profile.name + " [VIP]"; }

  const qKind = $("qType").value;

  const {error}=await supabase.from("game_questions").insert({
    room_id: currentRoom.id, 
    author_id: user.id, 
    nickname: authorName, 
    avatar: profile.avatar, 
    kind: qKind, 
    body: body || (selectedStickerUrl ? "✨ Sticker compartido:" : "📸 Foto del reto:"), 
    image_url: imageUrl,
    target_user_id: targetUser ? targetUser.id : null,
    target_nickname: targetUser ? targetUser.name : null,
    reward_claimed: qKind === 'pregunta' ? true : false
  });
  if(error)throw error;

  $("qText").value=""; $("presetSelector").value=""; fileInput.value="";
  selectedStickerUrl = null;
  renderStickersUI();
  window.cancelTarget();
  status("roomMsg","¡Publicado con éxito!","ok");
  playVipSound();
  refreshRoom(false);
 }catch(e){playFailSound(); status("roomMsg","Error al publicar: "+e.message,"error")}
}

async function leaveRoom(){
  if(roomChannel){await supabase.removeChannel(roomChannel);roomChannel=null}
  if(refreshTimer)clearInterval(refreshTimer);
  currentRoom=null;
  $("btnTabGame").classList.add("hidden");
  window.switchTab('tab-rooms', document.querySelectorAll('.tab-btn')[1]);
  history.replaceState({}, "", location.pathname);
}
